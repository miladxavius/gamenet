<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Qabus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#f6d9b8;font-family:system-ui,-apple-system,sans-serif}
#sky{position:fixed;inset:0}
#city{position:fixed;left:0;right:0;bottom:0;width:100%;height:34vh;transition:transform 1.2s,opacity 1.2s}
canvas{position:fixed;inset:0;display:block;touch-action:none;z-index:1}
.ui{position:fixed;z-index:2;pointer-events:none;color:#fff;text-shadow:0 2px 12px rgba(36,50,79,.3)}
#hud{top:max(24px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-family:"Bungee","Arial Black",sans-serif;transition:opacity .3s}
#score{font-size:60px;line-height:1}
#combo{font-size:15px;letter-spacing:2px;margin-top:6px;opacity:0;transition:opacity .25s;color:#fff6dc}
#best{top:max(20px,env(safe-area-inset-top));right:16px;font-size:11px;font-weight:700;letter-spacing:1px;text-align:right;opacity:.85}
#best b{display:block;font:20px "Bungee","Arial Black",sans-serif}
#msg{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16vh;text-align:center;transition:opacity .35s}
#msg .big{font:44px/1.1 "Bungee","Arial Black",sans-serif}
#msg .small{font-size:13px;font-weight:700;letter-spacing:3px;margin-top:10px;opacity:.9}
#msg .tap{margin-top:22px;font-size:14px;font-weight:700;letter-spacing:3px;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
body.playing #msg{opacity:0}
body:not(.playing) #hud{opacity:0}
</style>
</head>
<body>
<div id="sky"></div>
<svg id="city" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
 <path d="M0 150 Q60 120 120 140 T260 130 T400 135 V200 H0Z" fill="#fff" opacity=".18"/>
 <g fill="#fff" opacity=".28"><path d="M286 200 V70 L281 70 L300 22 L319 70 L314 70 V200Z"/><rect x="40" y="150" width="70" height="50"/><path d="M50 150 q25 -40 50 0z"/><rect x="150" y="160" width="60" height="40"/><path d="M340 200 v-36 h40 v36z"/></g>
</svg>
<div id="hud" class="ui"><div id="score">0</div><div id="combo">PERFECT</div></div>
<div id="best" class="ui">BEST<b id="bestv">0</b></div>
<div id="msg" class="ui"><div class="big" id="msgBig"></div><div class="small" id="msgSmall"></div><div class="tap" id="msgTap">TAP TO BUILD</div></div>

<script type="importmap">
{"imports":{"three":"../../vendor/three-0.160.0/three.module.min.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from '../../vendor/three-0.160.0/RoundedBoxGeometry.js';

const $ = id => document.getElementById(id);
const H = 0.5, START = 3, REACH = 5.5;   // slab height, starting width, how far a slab slides out

// inside Game Net the page runs in a frame: the site passes the player's best in the link and gets scores back by message
const HOSTED = window.parent !== window, hashBest = /best=(\d+)/.exec(location.hash);
function toHost(type, score){ if (HOSTED) try { parent.postMessage({gamenet:type, score}, '*'); } catch (e) {} }
let best = 0;
if (hashBest) best = +hashBest[1]; else try { best = +localStorage.getItem('qabus-best') || 0; } catch (e) {}
function saveBest(){ try { localStorage.setItem('qabus-best', best); } catch (e) {} }

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf3c9a8, 26, 60);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
const camOff = new THREE.Vector3(12, 10, 12);
let viewH = 15.5, viewHT = 15.5, camY = 1, camYT = 1;
function project(){
  const a = innerWidth / innerHeight;
  cam.left = -viewH * a / 2; cam.right = viewH * a / 2; cam.top = viewH / 2; cam.bottom = -viewH / 2;
  cam.updateProjectionMatrix();
}
function resize(){ renderer.setSize(innerWidth, innerHeight); project(); }
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xfff1e0, 0xb5a0c8, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, {left:-9, right:9, top:9, bottom:-9, near:1, far:50});
sun.shadow.bias = -0.0006; sun.shadow.radius = 4;
scene.add(sun, sun.target);

/* ---------- textures (drawn in code, no image files) ---------- */
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
const brickTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = '#e9d6bb'; g.fillRect(0, 0, w, h);           // mortar
  const bw = 64;
  for (let r = 0; r < 2; r++) for (let i = -1; i < 5; i++) {
    const x = i * bw + (r % 2 ? bw / 2 : 0), y = r * h / 2;
    g.fillStyle = `hsl(${18 + Math.random() * 8},55%,${52 + Math.random() * 8}%)`;
    g.beginPath(); g.roundRect(x + 3, y + 3, bw - 6, h / 2 - 6, 3); g.fill();
  }
});
const tileTex = canvasTex(128, 32, (g, w, h) => {
  g.fillStyle = '#1d8fb5'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) {
    const cx = i * 32 + 16, cy = 16;
    g.fillStyle = '#0f4e8c'; g.beginPath(); g.moveTo(cx, cy - 14); g.lineTo(cx + 14, cy); g.lineTo(cx, cy + 14); g.lineTo(cx - 14, cy); g.fill();
    g.fillStyle = '#f5f0e1'; g.beginPath();
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, r = k % 2 ? 4 : 9; g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
    g.fill();
    g.fillStyle = '#e6a93c'; g.beginPath(); g.arc(cx, cy, 2.2, 0, 7); g.fill();
  }
  g.fillStyle = '#f5f0e1'; g.fillRect(0, 0, w, 2); g.fillRect(0, h - 2, w, 2);
});
const stoneTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#e8dccb'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(120,100,80,.18)'; g.lineWidth = 2;
  for (let y = 0; y < h; y += 64) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    for (let x = (y / 64 % 2) * 64; x < w; x += 128) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 64); g.stroke(); }
  }
});

const KIND = {
  brick:{map:brickTex, rough:.85, color:0xffffff, top:0xdf8f62},
  tile:{map:tileTex, rough:.35, color:0xffffff, top:0x2aa3c8},
  gold:{map:null, rough:.3, color:0xe8b04a, top:0xf0c060, metal:.35},
};
// materials are shared: one per kind and side length (rounded), so a long game doesn't pile up textures
const sideMats = new Map(), topMats = {};
function sideMat(kind, len){
  const rep = Math.max(1, Math.round(len / 1.5 * 4)) / 4, key = kind + rep;
  if (!sideMats.has(key)) {
    const k = KIND[kind];
    const m = new THREE.MeshStandardMaterial({color:k.color, roughness:k.rough, metalness:k.metal || 0});
    if (k.map) { m.map = k.map.clone(); m.map.needsUpdate = true; m.map.repeat.set(rep, 1); }
    sideMats.set(key, m);
  }
  return sideMats.get(key);
}
function topMat(kind){
  const k = KIND[kind];
  return topMats[kind] || (topMats[kind] = new THREE.MeshStandardMaterial({color:k.top, roughness:k.rough, metalness:k.metal || 0}));
}
function slabMesh(w, d, kind){
  const sx = sideMat(kind, d), sz = sideMat(kind, w), t = topMat(kind);
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, H, d, 2, 0.05), [sx, sx, t, t, sz, sz]); // +x,-x,+y,-y,+z,-z
  m.castShadow = m.receiveShadow = true; return m;
}
function drop3(m){ scene.remove(m); m.geometry.dispose(); }

/* ---------- world ---------- */
// ten-flanged stone base, after the brick tower of Gonbad-e Qabus
function flangedPrism(rIn, rOut, height, n, mat){
  const s = new THREE.Shape();
  for (let i = 0; i < n * 2; i++) {
    const a = i / (n * 2) * Math.PI * 2, r = i % 2 ? rIn : rOut;
    i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const g = new THREE.ExtrudeGeometry(s, {depth:height, bevelEnabled:true, bevelSize:.06, bevelThickness:.06, bevelSegments:2});
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; return m;
}
const stoneMat = new THREE.MeshStandardMaterial({map:stoneTex, roughness:.95});
const plinth = flangedPrism(2.9, 3.3, 1.2, 10, stoneMat); plinth.position.y = -1.7; scene.add(plinth);
const plinth2 = flangedPrism(3.6, 4.0, 0.6, 10, stoneMat); plinth2.position.y = -2.4; scene.add(plinth2);

const clouds = [];
const cloudMat = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:.35, roughness:1, transparent:true, opacity:.9});
const puff = new THREE.IcosahedronGeometry(1, 2);
for (let i = 0; i < 12; i++) {
  const g = new THREE.Group();
  [[0,0,0,1],[1,.1,0,.8],[-1,.05,.1,.75],[.4,.45,0,.7]].forEach(([a,b,c,r]) => {
    const s = new THREE.Mesh(puff, cloudMat); s.position.set(a, b, c); s.scale.setScalar(r); g.add(s);
  });
  g.position.set(i % 2 ? -9 : 4, 5 + i * 4.5, i % 2 ? 2 : -9); g.scale.setScalar(.45 + Math.random() * .3);
  scene.add(g); clouds.push(g);
}

/* ---------- sky colour by height: day, sunset, night ---------- */
const SKY = [[0,'#7fa7d9','#f7cfa6'],[14,'#6f8fd0','#f2b08e'],[30,'#4a5ba8','#d98a8a'],[50,'#25295e','#6b4f8f'],[80,'#0d1030','#2b2b66']];
function lerpHex(a, b, t){
  const p = x => [1,3,5].map(i => parseInt(x.substr(i, 2), 16)), A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function skyAt(n){
  let i = 0; while (i < SKY.length - 2 && n > SKY[i + 1][0]) i++;
  const [h0,t0,b0] = SKY[i], [h1,t1,b1] = SKY[i + 1], t = Math.min(1, Math.max(0, (n - h0) / (h1 - h0)));
  const bot = lerpHex(b0, b1, t);
  $('sky').style.background = `linear-gradient(${lerpHex(t0, t1, t)},${bot})`;
  scene.fog.color.set(bot);
  $('city').style.transform = `translateY(${Math.min(n, 30) * 1.4}vh)`; $('city').style.opacity = Math.max(0, 1 - n / 30);
}

/* ---------- game ---------- */
let stack = [], moving = null, falling = [], rings = [], score = 0, combo = 0, axis = 'x', dir = 1, speed = 4.2;
let state = 'ready', overAt = 0;   // ready -> playing -> over -> (tap) playing
const layerKind = n => combo >= 3 ? 'gold' : n % 4 === 3 ? 'tile' : 'brick';

function addLayer(x, z, w, d, kind){
  const m = slabMesh(w, d, kind); m.position.set(x, stack.length * H, z); scene.add(m);
  stack.push({m, x, z, w, d, kind}); return m;
}
function clearWorld(){
  [...stack, ...falling, ...rings].forEach(s => drop3(s.m)); if (moving) drop3(moving.m);
  stack = []; falling = []; rings = []; moving = null;
}
function newTower(){
  clearWorld(); score = 0; combo = 0; axis = 'x'; speed = 4.2;
  addLayer(0, 0, START, START, 'brick');
  viewHT = 15.5; hud();
}
function spawn(){
  const top = stack[stack.length - 1];
  axis = axis === 'x' ? 'z' : 'x';
  const kind = layerKind(stack.length);
  const s = {m:slabMesh(top.w, top.d, kind), x:top.x, z:top.z, w:top.w, d:top.d, kind, t:0};
  s[axis] = (axis === 'x' ? top.x : top.z) - REACH; dir = 1;
  s.m.position.set(s.x, stack.length * H, s.z); scene.add(s.m); moving = s;
}
function cut(kind, x, z, w, d, y, vx, vz){
  const m = slabMesh(w, d, kind); m.position.set(x, y, z); scene.add(m);
  falling.push({m, vy:0, vx, vz, rx:(Math.random() - .5) * 2, rz:(Math.random() - .5) * 2, life:2.5});
}
function place(){
  const top = stack[stack.length - 1], s = moving, y = stack.length * H;
  const size = axis === 'x' ? 'w' : 'd';
  const delta = s[axis] - top[axis], keep = top[size] - Math.abs(delta);
  drop3(s.m); moving = null;
  if (keep <= 0) {   // missed the tower: the slab falls and the round ends
    cut(s.kind, s.x, s.z, s.w, s.d, y, axis === 'x' ? Math.sign(delta) * 2 : 0, axis === 'z' ? Math.sign(delta) * 2 : 0);
    return gameOver();
  }
  let nx = s.x, nz = s.z, nw = s.w, nd = s.d;
  if (Math.abs(delta) < 0.09) {   // perfect: it snaps on, and from the third in a row the tower grows back a little
    combo++; nx = top.x; nz = top.z; nw = top.w; nd = top.d;
    if (combo >= 3) { nw = Math.min(START, nw + .25); nd = Math.min(START, nd + .25); }
    ring(nx, y, nz, nw, nd); flashCombo();
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  } else {
    combo = 0;
    const lost = s[size] - keep, c = top[axis] + delta / 2, off = Math.sign(delta) * (keep / 2 + lost / 2);
    if (axis === 'x') { nw = keep; nx = c; cut(s.kind, c + off, s.z, lost, s.d, y, Math.sign(delta) * 1.2, 0); }
    else { nd = keep; nz = c; cut(s.kind, s.x, c + off, s.w, lost, y, 0, Math.sign(delta) * 1.2); }
  }
  addLayer(nx, nz, nw, nd, s.kind).userData.pop = 1;
  stack[stack.length - 1].m.scale.y = .6;
  score++; speed = Math.min(9, 4.2 + score * .08);
  hud(); toHost('score', score); spawn();
}
function gameOver(){
  state = 'over'; overAt = performance.now();
  const isBest = score > best;
  if (isBest) { best = score; saveBest(); }
  toHost('over', score);
  document.body.classList.remove('playing');
  $('msgBig').textContent = score; $('msgSmall').textContent = isBest && score ? 'NEW BEST' : 'BEST ' + best;
  $('msgTap').textContent = 'TAP TO BUILD AGAIN';
  // pull back to show the whole tower
  viewHT = Math.max(15.5, stack.length * H * 1.5 + 6); camYT = stack.length * H / 2 - 1;
  hud();
}
function ring(x, y, z, w, d){
  const r = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w + .05, .02, d + .05)),
    new THREE.LineBasicMaterial({color:0xffffff, transparent:true}));
  r.position.set(x, y + H / 2, z); scene.add(r); rings.push({m:r, t:0});
}
let comboT;
function flashCombo(){
  const e = $('combo'); e.textContent = combo > 1 ? `PERFECT ×${combo}` : 'PERFECT'; e.style.opacity = 1;
  clearTimeout(comboT); comboT = setTimeout(() => e.style.opacity = 0, 700);
}
function hud(){ $('score').textContent = score; $('bestv').textContent = best; skyAt(score); }

function tap(e){
  if (e) e.preventDefault();
  if (state === 'playing') { if (moving) place(); return; }
  if (state === 'over' && performance.now() - overAt < 700) return;   // a late tap doesn't skip the result
  if (state === 'over') newTower();
  state = 'playing'; document.body.classList.add('playing'); spawn();
}
addEventListener('pointerdown', tap);
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') tap(e); });
// leaving mid-round still counts the score
addEventListener('pagehide', () => { if (state === 'playing' && score > 0) toHost('over', score); });

/* ---------- loop ---------- */
const clock = new THREE.Clock(), look = new THREE.Vector3();
function step(dt){
  if (moving) {
    moving[axis] += dir * speed * dt;
    const top = stack[stack.length - 1], c = axis === 'x' ? top.x : top.z;
    if (moving[axis] > c + REACH) dir = -1; if (moving[axis] < c - REACH) dir = 1;
    moving.m.position.set(moving.x, stack.length * H, moving.z);
  }
  for (const f of falling) {
    f.vy -= 18 * dt; f.m.position.x += f.vx * dt; f.m.position.z += f.vz * dt; f.m.position.y += f.vy * dt;
    f.m.rotation.x += f.rx * dt; f.m.rotation.z += f.rz * dt; f.life -= dt;
  }
  falling = falling.filter(f => f.life > 0 || (drop3(f.m), false));
  for (const r of rings) { r.t += dt; const k = 1 + r.t * 1.6; r.m.scale.set(k, 1, k); r.m.material.opacity = Math.max(0, 1 - r.t * 1.8); }
  rings = rings.filter(r => r.t < .6 || (drop3(r.m), false));
  for (const s of stack) {
    const m = s.m;
    if (m.userData.pop) { m.scale.y += (1 - m.scale.y) * Math.min(1, dt * 14); if (m.scale.y > .995) { m.scale.y = 1; m.userData.pop = 0; } }
  }
  clouds.forEach((c, i) => c.position.x += dt * (.15 + (i % 3) * .05));
  if (state !== 'over') camYT = stack.length * H - 3.2;
  camY += (camYT - camY) * Math.min(1, dt * 3);
  if (Math.abs(viewHT - viewH) > .01) { viewH += (viewHT - viewH) * Math.min(1, dt * 3); project(); }
  // far below the camera, layers stop casting shadows to keep phones smooth
  const low = camY - viewH;
  for (const s of stack) { const v = s.m.position.y > low; s.m.visible = v || state === 'over'; s.m.castShadow = s.m.position.y > camY - 8; }
  look.set(0, camY, 0); cam.position.copy(look).add(camOff); cam.lookAt(look);
  sun.position.set(-6, camY + 14, 8); sun.target.position.set(0, camY, 0);
}
function frame(){
  const dt = Math.min(.05, clock.getDelta());
  step(dt); renderer.render(scene, cam); requestAnimationFrame(frame);
}

newTower();
$('msgBig').textContent = ''; $('msgSmall').textContent = best ? 'BEST ' + best : '';
frame();
</script>
</body>
</html>
